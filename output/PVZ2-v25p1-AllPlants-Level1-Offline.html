 constructor(bytes){this.a=bytes;this.p=8;this.c=[[],[]];if(dec.decode(bytes.slice(0,4))!=='RTON'||new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength).getUint32(4,true)!==1)throw Error('需要RTON格式pp.dat');}

 variable(){let x=0n,s=0n;for(let i=0;i<10;i++){const b=this.byte();x|=BigInt(b&127)<<s;if(b<128)return x;s+=7n;}throw Error('无效变长整数');}
 small(){const b=this.variable();if(b>10000000n)throw Error('数组或字符串过大');return Number(b);}
 string(){return dec.decode(this.bytes(this.small()));}

 object(){const o=Object.create(null);for(;;){const t=this.byte();if(t===255)return o;const k=this.value(t);if(typeof k!=='string')throw Error('键类型错误');o[k]=this.value(this.byte());}}

function editSave(bytes){

 d.p=Array.from(new Set([...d.p.map(x=>Number(x)),...PLANT_IDS])).sort((a,b)=>Number(a)-Number(b));const known=new Set();

const picker=document.getElementById("file"),log=document.getElementById("status"),runButton=document.getElementById("go");runButton.onclick=async()=>{try{if(!picker.files[0])throw Error('请先选择pp.dat');const a=new Uint8Array(await picker.files[0].arrayBuffer());const out=editSave(a);const url=URL.createObjectURL(new Blob([out]));const link=document.createElement('a');link.href=url;link.download='pp.dat';link.click();log.textContent='已生成修改版pp.dat：174种可选植物全解锁、全部一级。彻底退出游戏进程，再备份并覆盖当前存档；不要删除其他文件。尚未安卓实机读档验证。';setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){log.textContent='未生成文件：'+e.message;}};</script>
